name: Validate FijasPro Data
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/validate_repository.py
      - run: python -m unittest discover -s tests -v
      - name: Normalize licensed OpenFootball source files
        run: python scripts/normalize_openfootball.py --root . --out data/normalized/openfootball_matches.jsonl
      - name: Commit normalized dataset and audit report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/normalized/openfootball_matches.jsonl data/normalized/openfootball_normalization_report.json
          if ! git diff --cached --quiet; then
            git commit -m "Build normalized OpenFootball dataset"
            git push
          else
            echo "Normalized dataset is already up to date."
          fi
      - name: Upload normalized dataset and audit report
        uses: actions/upload-artifact@v4
        with:
          name: fijaspro-openfootball-normalized
          path: |
            data/normalized/openfootball_matches.jsonl
            data/normalized/openfootball_normalization_report.json
          if-no-files-found: error
          retention-days: 30
